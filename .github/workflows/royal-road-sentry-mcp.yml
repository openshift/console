name: royal-road-sentry-mcp

# Builds the Sentry MCP image for Lightspeed (royal-road/plugins/sentry-mcp/):
# @sentry/mcp-server behind supergateway, versions pinned in package-lock.json.
# Pull requests build without pushing; main pushes
# ghcr.io/<owner>/sentry-mcp:<short-sha> and :main.

on:
  push:
    branches: [main]
    paths:
      - royal-road/plugins/sentry-mcp/**
      - .github/workflows/royal-road-sentry-mcp.yml
  pull_request:
    paths:
      - royal-road/plugins/sentry-mcp/**
      - .github/workflows/royal-road-sentry-mcp.yml
  workflow_dispatch:

concurrency:
  group: royal-road-sentry-mcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sentry-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: royal-road/plugins/sentry-mcp
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=sentry-mcp
          cache-to: type=gha,mode=max,scope=sentry-mcp
