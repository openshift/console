name: royal-road-web-terminal-routing

# Tests and builds the DevWorkspaceRouting controller in
# royal-road/web-terminal-routing/ (see royal-road/deploy/web-terminal/). On
# main it pushes ghcr.io/<owner>/web-terminal-routing tagged with the short SHA
# of the commit that built it and `main`.

on:
  push:
    branches: [main]
    paths:
      - royal-road/web-terminal-routing/**
      - .github/workflows/royal-road-web-terminal-routing.yml
  pull_request:
    paths:
      - royal-road/web-terminal-routing/**
      - .github/workflows/royal-road-web-terminal-routing.yml
  workflow_dispatch:

concurrency:
  group: royal-road-web-terminal-routing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/web-terminal-routing
  SRC_DIR: royal-road/web-terminal-routing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.SRC_DIR }}/go.mod
          cache-dependency-path: ${{ env.SRC_DIR }}/go.sum

      - name: Test
        working-directory: ${{ env.SRC_DIR }}
        run: |
          go vet ./...
          go test ./...

      - name: Version
        id: version
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.SRC_DIR }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=web-terminal-routing
          cache-to: type=gha,mode=max,scope=web-terminal-routing
