name: royal-road-monitoring-plugin

# Builds openshift/monitoring-plugin from the upstream commit pinned in
# royal-road/plugins/monitoring-plugin/upstream.env, with our patches, on
# public base images. No published image matches release-5.0 (see the
# directory's README.md). On main it pushes ghcr.io/<owner>/monitoring-plugin
# tagged with the short SHA of the commit that built it and `main`.

on:
  push:
    branches: [main]
    paths:
      - royal-road/plugins/monitoring-plugin/**
      - .github/workflows/royal-road-monitoring-plugin.yml
  pull_request:
    paths:
      - royal-road/plugins/monitoring-plugin/**
      - .github/workflows/royal-road-monitoring-plugin.yml
  workflow_dispatch:

concurrency:
  group: royal-road-monitoring-plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/monitoring-plugin
  PLUGIN_DIR: royal-road/plugins/monitoring-plugin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          . "$PLUGIN_DIR/upstream.env"
          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.PLUGIN_DIR }}
          labels: io.github.openshift.monitoring-plugin.revision=${{ steps.version.outputs.upstream_commit }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=monitoring-plugin
          cache-to: type=gha,mode=max,scope=monitoring-plugin
