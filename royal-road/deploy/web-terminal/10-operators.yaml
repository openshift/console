# DevWorkspace Operator and Web Terminal Operator through OLM v0.
#
# Neither operator is in the operatorhub.io catalog. Each project publishes
# its own index image; both are pinned by digest here so the catalog content
# only changes when this file does. Both Subscriptions use Manual approval:
# OLM proposes an InstallPlan and nothing installs or upgrades until someone
# approves it (README: "Install").
#
# The console bridge finds the operator through a Subscription named
# exactly "web-terminal" (pkg/terminal/operator.go) and uses its namespace
# as the namespace of the DevWorkspaceTemplates.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: devworkspace-operator-catalog
  namespace: web-terminal
spec:
  displayName: DevWorkspace Operator
  publisher: devfile.io
  sourceType: grpc
  # quay.io/devfile/devworkspace-operator-index:release as of 2026-11-14
  # (bundles up to devworkspace-operator.v1.1.0, channel "fast").
  image: quay.io/devfile/devworkspace-operator-index@sha256:b0a3d5be91e3051a10e71f27cd0a051affbbc721513fc9bbb55ea8562517d295
  grpcPodConfig:
    securityContextConfig: restricted
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: web-terminal-catalog
  namespace: web-terminal
spec:
  displayName: Web Terminal Operator
  publisher: Red Hat (upstream builds)
  sourceType: grpc
  # quay.io/wto/web-terminal-operator-index:next as of 2026-11-14. The only
  # public WTO index: one bundle (web-terminal.v1.18.0, channel "fast") built
  # from the upstream main branch. Released WTO images are only on
  # registry.redhat.io, which needs a Red Hat account.
  image: quay.io/wto/web-terminal-operator-index@sha256:e2a84eb63b6c5fa0936199d513eb8e81b0467bee81a20dfa39c95d9caf812dcc
  grpcPodConfig:
    # This index is in the old SQLite format (opm registry serve). In
    # "restricted" mode OLM starts the pod as a file-based catalog (opm serve
    # /configs), which this image does not have, and it crash-loops.
    securityContextConfig: legacy
---
# Both operators only support the AllNamespaces install mode.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: web-terminal
  namespace: web-terminal
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devworkspace-operator
  namespace: web-terminal
spec:
  channel: fast
  name: devworkspace-operator
  source: devworkspace-operator-catalog
  sourceNamespace: web-terminal
  startingCSV: devworkspace-operator.v1.1.0
  installPlanApproval: Manual
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: web-terminal
  namespace: web-terminal
spec:
  channel: fast
  name: web-terminal
  source: web-terminal-catalog
  sourceNamespace: web-terminal
  startingCSV: web-terminal.v1.18.0
  installPlanApproval: Manual
