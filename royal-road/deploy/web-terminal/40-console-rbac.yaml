# What the console bridge reads with its own ServiceAccount to decide whether
# the terminal is available (pkg/terminal/operator.go): the Subscription
# named "web-terminal" in any namespace, and the DevWorkspace Operator's
# webhook configurations (their presence means DevWorkspaces with
# restricted-access are protected, the precondition for sending a user's
# token into one). Everything else the terminal does runs with the user's
# own token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-web-terminal-reader
rules:
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames: [controller.devfile.io]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-web-terminal-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-web-terminal-reader
subjects:
  - kind: ServiceAccount
    name: <console-serviceaccount>
    namespace: <console-namespace>
