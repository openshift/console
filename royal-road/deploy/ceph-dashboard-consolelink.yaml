# Adds "Ceph dashboard" to the console's application menu (the grid icon in the
# masthead), under a "Storage" section. Requires the ConsoleLink CRD from
# crds/00_consolelinks.crd.yaml. Replace the placeholder URL with the Ceph mgr
# dashboard's public address before applying. Apply
# console-extensions-reader.yaml too, or only cluster-admins see the link.
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: ceph-dashboard
spec:
  location: ApplicationMenu
  text: Ceph dashboard
  href: https://ceph-dashboard.example.com
  applicationMenu:
    section: Storage
