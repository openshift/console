# Kubernetes logos for the console masthead, the About modal and the favicon.
# Mounted into the console Pod and passed to the bridge with
# BRIDGE_CUSTOM_LOGO_FILES and BRIDGE_CUSTOM_FAVICON_FILES; see "Branding" in
# README.md.
#
# Source: https://github.com/cncf/artwork (projects/kubernetes/), commit
# 6b5a2ec58e8ef26ddeeaa409425ba1bfd9005f8e:
#   horizontal/color/kubernetes-horizontal-color.svg            (light theme)
#   horizontal/white-text/kubernetes-horizontal-white-text.svg  (dark theme)
#   icon/color/kubernetes-icon-color.svg                        (favicon)
# The two horizontal logos get width="143" height="37" on the root <svg>
# element, nothing else changes. The originals only have a viewBox, and an
# image with no intrinsic size collapses to 0x0 in the masthead (an auto-width
# link whose image has max-width: 100%). 37px is the masthead logo's height.
#
# Kubernetes is a registered trademark of The Linux Foundation. Use of the logo
# follows the Linux Foundation trademark usage guidelines
# (https://www.linuxfoundation.org/legal/trademark-usage). The console uses it
# only to identify the Kubernetes cluster it manages, unaltered.
#
# Regenerate (in an empty directory holding the three files):
#   sed -i '0,/<svg /s//<svg width="143" height="37" /' kubernetes-horizontal-*.svg
#   kubectl create configmap console-branding --dry-run=client -o yaml --from-file=.
apiVersion: v1
