# EXAMPLE ONLY. DO NOT APPLY IN PRODUCTION: there the Secret already exists,
# created through the infrastructure secret flow, and this placeholder would
# overwrite the real key.
#
# The GPUStack API key OLS sends as `Authorization: Bearer <key>`. Create it
# through the infrastructure secret flow; never commit the key. Equivalent:
#   kubectl -n openshift-lightspeed create secret generic lightspeed-gpustack \
#     --from-literal=apikey="$GPUSTACK_API_KEY"
# OLS strips trailing whitespace from the key file.
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-gpustack
  namespace: openshift-lightspeed
type: Opaque
stringData:
  apikey: <gpustack-api-key>
