# The Lightspeed console plugin (chat button and panel), built from
# openshift/lightspeed-console by .github/workflows/royal-road-lightspeed-plugin.yml
# (see royal-road/plugins/lightspeed-console-plugin/). Static files only, plain
# HTTP on 8080: the bridge fetches them and serves them to the browser. Chat
# requests go browser -> bridge -> OLS through BRIDGE_PLUGIN_PROXY, never to
# this pod.
#
# Replace <sha> with the image tag CI pushed (short commit SHA of main).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-console-plugin
  namespace: openshift-lightspeed
  labels:
    app.kubernetes.io/name: lightspeed-console-plugin
    app.kubernetes.io/part-of: lightspeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-console-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-console-plugin
        app.kubernetes.io/part-of: lightspeed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plugin
          image: ghcr.io/royal-road/lightspeed-console-plugin:<sha>
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              # nginx starts one worker per CPU of the node.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-console-plugin
  namespace: openshift-lightspeed
  labels:
    app.kubernetes.io/name: lightspeed-console-plugin
    app.kubernetes.io/part-of: lightspeed
spec:
  selector:
    app.kubernetes.io/name: lightspeed-console-plugin
  ports:
    - name: http
      port: 8080
      targetPort: http
