# Weekly rebuild: a CronJob that creates a PipelineRun.
#
# Pipelines-as-Code starts runs on Git events only (no cron), and Tekton
# Triggers would need an EventListener Service plus a CronJob to call it
# anyway. Creating the PipelineRun directly needs one ServiceAccount allowed to
# create pipelineruns here, and nothing listens on the network.
#
# What the schedule picks up: changes to royal-road/console docs (FORK.md,
# READMEs, CHANGELOG) and to sources.yaml (version bumps of upstream docs).
# Infrastructure docs are rebuilt on push by Pipelines-as-Code
# (pac/.tekton/lightspeed-docs-index.yaml); this run uses its deploy key.
#
# Needs the Secrets lightspeed-docs-harbor-push and lightspeed-docs-infra-ssh
# (examples/). Run it once by hand:
#   kubectl -n lightspeed-docs create job --from=cronjob/lightspeed-docs-weekly lightspeed-docs-manual
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-docs-pipelinerun
  namespace: lightspeed-docs
data:
  pipelinerun.yaml: |
    apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: lightspeed-docs-weekly-
      namespace: lightspeed-docs
      labels:
        app.kubernetes.io/part-of: lightspeed
        lightspeed-docs/trigger: schedule
    spec:
      pipelineRef:
        name: lightspeed-docs-index
      params:
        - {name: infra-url, value: "git@github.com:royal-road/infrastructure.git"}
      taskRunTemplate:
        serviceAccountName: lightspeed-docs-builder
      timeouts:
        pipeline: 2h
      workspaces:
        - name: source
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 4Gi
        - name: dockerconfig
          secret:
            secretName: lightspeed-docs-harbor-push
        - name: infra-ssh
          secret:
            secretName: lightspeed-docs-infra-ssh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lightspeed-docs-weekly
  namespace: lightspeed-docs
  labels:
    app.kubernetes.io/part-of: lightspeed
spec:
  # Sundays 03:17 UTC
  schedule: "17 3 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: lightspeed-docs-scheduler
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: create-pipelinerun
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command: [kubectl, create, -f, /run/pipelinerun/pipelinerun.yaml, -o, name]
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: pipelinerun, mountPath: /run/pipelinerun, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: pipelinerun
              configMap:
                name: lightspeed-docs-pipelinerun
            - name: tmp
              emptyDir: {}
