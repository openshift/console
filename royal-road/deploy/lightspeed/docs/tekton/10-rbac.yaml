# lightspeed-docs-builder: runs every Task except discover and rollout-*
# (15-, 16-*.yaml). It needs no Kubernetes API
# access; credentials come in as workspaces (Harbor push Secret, git
# credentials).
#
# lightspeed-docs-scheduler: the daily CronJob (40-schedule.yaml). It may
# only list and create PipelineRuns in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-docs-builder
  namespace: lightspeed-docs
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-docs-scheduler
  namespace: lightspeed-docs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lightspeed-docs-scheduler
  namespace: lightspeed-docs
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lightspeed-docs-scheduler
  namespace: lightspeed-docs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lightspeed-docs-scheduler
subjects:
  - kind: ServiceAccount
    name: lightspeed-docs-scheduler
    namespace: lightspeed-docs
