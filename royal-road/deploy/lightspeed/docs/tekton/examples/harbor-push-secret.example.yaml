# Shape only. DO NOT APPLY IN PRODUCTION: create the Secret through the
# infrastructure secret flow.
#
# Harbor robot account with push (and pull) on the repository
# <registry>/<project>/lightspeed-docs-index (Harbor robots are scoped to a
# project; grant only repository pull and push). The discover Task (lookup)
# and the index Task's push step (skopeo) read it from the dockerconfig
# workspace.
#
#   kubectl -n lightspeed-docs create secret docker-registry lightspeed-docs-harbor-push \
#     --docker-server=<registry> --docker-username='<robot name>' --docker-password-stdin
#
# (kubectl writes .dockerconfigjson; both steps accept it and
# config.json and .dockerconfigjson keys.)
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-docs-harbor-push
  namespace: lightspeed-docs
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths": {"<registry>": {"auth": "<base64 of robot-name:robot-secret>"}}}
