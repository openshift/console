# A manual run (kubectl create -f; generateName needs create, not apply).
# Uses the deploy-key Secret for the infrastructure repository, like the
# daily schedule.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: lightspeed-docs-manual-
  namespace: lightspeed-docs
spec:
  pipelineRef:
    name: lightspeed-docs-index
  params:
    - {name: infra-url, value: "git@github.com:royal-road/infrastructure.git"}
    # - {name: profile, value: smoke}   # a few files per source
  taskRunTemplate:
    serviceAccountName: lightspeed-docs-builder
  taskRunSpecs:
    - {pipelineTaskName: discover, serviceAccountName: lightspeed-docs-discovery}
    - {pipelineTaskName: rollout-new, serviceAccountName: lightspeed-docs-rollout}
    - {pipelineTaskName: rollout-existing, serviceAccountName: lightspeed-docs-rollout}
  timeouts:
    pipeline: 2h
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 4Gi
    - name: dockerconfig
      secret:
        secretName: lightspeed-docs-harbor-push
    - name: sources-config
      configMap:
        name: lightspeed-docs-sources
    - name: infra-ssh
      secret:
        secretName: lightspeed-docs-infra-ssh
