# Task lightspeed-docs-index: Markdown sources -> OLS BYOK FAISS indexes.
#
# Expects in the `source` workspace (the Pipeline's git-clone tasks put them
# there): console/ (royal-road/console, for the scripts and sources.yaml) and
# infrastructure/ (royal-road/infrastructure). Fetches the pinned upstream docs
# itself (public, anonymous, sparse), then writes work/image/, the build
# context of the index image, and returns the image tag.
#
# Steps run in one pod as UID 65532 (gid 0; the workspace gets fsGroup 65532
# from the cluster's default pod template):
#   plan      sources.yaml -> work/fetch.tsv                        (OLS image)
#   fetch     sparse, shallow fetch of each pinned upstream commit  (git image)
#   corpus    Markdown with title/url front matter -> work/corpus   (OLS image)
#   gitleaks  over the Royal Road corpus; any finding fails the run (gitleaks)
#   index     chunk, secret gate, embed, persist -> work/image      (OLS image)
#
# The Python steps run in the OLS image that serves the index, so llama-index,
# FAISS and the embedding model match what OLS loads. Pin `ols-image` to the
# digest in royal-road/deploy/lightspeed/42-ols.yaml.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lightspeed-docs-index
  namespace: lightspeed-docs
  labels:
    app.kubernetes.io/part-of: lightspeed
    app.kubernetes.io/version: "1"
spec:
  description: Builds the OLS BYOK documentation indexes (Royal Road + upstream docs).
  workspaces:
    - name: source
  params:
    - name: tools
      description: Directory with build_corpus.py and build_index.py, relative to the workspace.
      default: console/royal-road/deploy/lightspeed/docs
    - name: sources
      description: sources.yaml, relative to the workspace.
      default: console/royal-road/deploy/lightspeed/docs/sources.yaml
    - name: profile
      description: full, or smoke (a few files per source, for tests).
      default: full
    - name: infra-commit
      description: Commit of the infrastructure checkout (git-clone result COMMIT).
    - name: console-commit
      description: Commit of the console checkout (git-clone result COMMIT).
    - name: ols-image
      default: quay.io/openshift-lightspeed/lightspeed-service-api@sha256:63924c0ebfe6e8765a65d2f29257fbde6376f884c1994951e1a0dfa1807a43c0
    - name: git-image
      # same image as tekton-catalog's git-clone Task
      default: ghcr.io/tektoncd-catalog/git-clone:v1.7.1@sha256:452e6f06cb0fa708fb145adbe4472e3db63c02ebacf5ecd149897859567d7460
    - name: gitleaks-image
      default: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  results:
    - name: TAG
      description: Image tag, <yyyymmdd>-<infrastructure commit, 10 chars>.
  stepTemplate:
    env:
      - name: HOME
        value: /tekton/home
      - name: WS
        value: $(workspaces.source.path)
      - name: TOOLS
        value: $(workspaces.source.path)/$(params.tools)
      - name: SOURCES
        value: $(workspaces.source.path)/$(params.sources)
      - name: PROFILE
        value: $(params.profile)
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: plan
      image: $(params.ols-image)
      workingDir: $(workspaces.source.path)
      command: [sh, -ec]
      args:
        - |
          # Every step's workingDir is the workspace root: Tekton would
          # create any other workingDir as root before the steps run.
          rm -rf work && mkdir work
          python "$TOOLS/build_corpus.py" plan --sources "$SOURCES" --profile "$PROFILE" --out work/fetch.tsv
      computeResources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 512Mi}

    - name: fetch
      image: $(params.git-image)
      workingDir: $(workspaces.source.path)
      command: [sh, -ec]
      args:
        - |
          cd work
          tab=`printf '\t'`
          mkdir -p upstream
          while IFS="$tab" read -r name repo commit path; do
            [ -n "$name" ] || continue
            echo "fetch $name $repo $commit $path"
            git init -q "upstream/$name"
            git -C "upstream/$name" remote add origin "$repo"
            git -C "upstream/$name" sparse-checkout set --no-cone "$path"
            git -C "upstream/$name" -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin "$commit"
            git -C "upstream/$name" checkout -q FETCH_HEAD
            got=`git -C "upstream/$name" rev-parse HEAD`
            [ "$got" = "$commit" ] || { echo "$name: got $got, want $commit"; exit 1; }
          done < fetch.tsv
      computeResources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {memory: 1Gi}

    - name: corpus
      image: $(params.ols-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: INFRA_COMMIT
          value: $(params.infra-commit)
        - name: CONSOLE_COMMIT
          value: $(params.console-commit)
      command: [sh, -ec]
      args:
        - |
          cd work
          python "$TOOLS/build_corpus.py" corpus --sources "$SOURCES" --profile "$PROFILE" \
            --upstream-dir upstream --checkout-root "$WS" --out corpus \
            --commit "infrastructure=$INFRA_COMMIT" --commit "console=$CONSOLE_COMMIT"
          rm -rf upstream
      computeResources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {memory: 1Gi}

    - name: gitleaks
      image: $(params.gitleaks-image)
      workingDir: $(workspaces.source.path)
      command: [gitleaks]
      args: [dir, work/corpus/royal-road, --no-banner, --redact, --exit-code, "1"]
      computeResources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 512Mi}

    - name: index
      image: $(params.ols-image)
      workingDir: $(workspaces.source.path)
      env:
        - name: INFRA_COMMIT
          value: $(params.infra-commit)
      command: [sh, -ec]
      args:
        - |
          cd work
          python "$TOOLS/build_index.py" --corpus corpus --out image \
            --commit "$INFRA_COMMIT" --tag-file "$(results.TAG.path)"
          du -sh image image/*
      computeResources:
        # Embedding is CPU-bound; build_index.py uses as many threads as the
        # CPU limit allows.
        requests: {cpu: "2", memory: 2Gi}
        limits: {cpu: "4", memory: 4Gi}
