# kind-only fixtures for kind-verify.sh: a plain-HTTP registry (stands in for
# Harbor) and a git daemon (stands in for the private infrastructure repo).
apiVersion: v1
kind: Namespace
metadata:
  name: lsdocs-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: lsdocs-test
spec:
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:3
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: lsdocs-test
spec:
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: lsdocs-test
spec:
  selector: {matchLabels: {app: git}}
  template:
    metadata: {labels: {app: git}}
    spec:
      containers:
        - name: git
          image: docker.io/library/alpine:3.22
          command: ["sh", "-c"]
          args:
            - apk add --no-cache git git-daemon >/dev/null && mkdir -p /srv/git &&
              exec git daemon --reuseaddr --export-all --enable=receive-pack --base-path=/srv/git /srv/git
          ports: [{containerPort: 9418}]
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: lsdocs-test
spec:
  selector: {app: git}
  ports: [{port: 9418, targetPort: 9418}]
