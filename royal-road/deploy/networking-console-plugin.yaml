# openshift/networking-console-plugin for the Royal Road console (FORK.md WP3).
#
# Placeholders:
#   <console-namespace>  namespace of the console Deployment
#   <sha>                image tag from .github/workflows/royal-road-networking-plugin.yml
#
# The plugin is static files only. The bridge fetches them from this Service and
# proxies them to the browser; API calls go through the bridge's own proxy, so
# the plugin needs no ServiceAccount permissions.
#
# Plain HTTP inside the cluster: the plugin's upstream chart serves TLS with a
# certificate from OpenShift's service CA, which this cluster doesn't have. The
# files are public UI code with no secrets, so the bridge reaches them over HTTP
# on the cluster network. See README.md, "Networking plugin".
#
# Load it in the console Deployment:
#   - name: BRIDGE_PLUGINS
#     value: networking-console-plugin=http://networking-console-plugin.<console-namespace>.svc.cluster.local:8080/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: networking-console-plugin
  namespace: <console-namespace>
  labels:
    app.kubernetes.io/name: networking-console-plugin
    app.kubernetes.io/part-of: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: networking-console-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: networking-console-plugin
        app.kubernetes.io/part-of: console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: networking-console-plugin
          image: ghcr.io/royal-road/networking-console-plugin:<sha>
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: http
          livenessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: networking-console-plugin
  namespace: <console-namespace>
  labels:
    app.kubernetes.io/name: networking-console-plugin
    app.kubernetes.io/part-of: console
spec:
  selector:
    app.kubernetes.io/name: networking-console-plugin
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
